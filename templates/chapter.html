{% extends 'base.html' %}
{% block content %}
<div class="max-w-6xl mx-auto px-6 py-10 space-y-10">
    <div>
        <a href="/subject/{{ subject }}" class="text-blue-600 dark:text-blue-400 hover:underline text-xs font-bold tracking-wider uppercase mb-2 inline-block">← Back to Subject Hub</a>
        <h1 class="text-3xl font-black text-slate-800 dark:text-white tracking-tight">{{ subject }} Chapters</h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">Select a chapter to review estimated practice durations and launch target drills.</p>
    </div>

    <!-- Chapter Grid -->
    <div id="chapter-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Dynamically Loaded Chapters -->
    </div>
</div>

<script>
    const sub = "{{ subject }}";
    
    fetch(`/api/chapters/${encodeURIComponent(sub)}`)
        .then(res => res.json())
        .then(chapters => {
            const list = document.getElementById('chapter-list');
            if (!chapters || chapters.length === 0) {
                list.innerHTML = `
                    <div class="col-span-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 text-center">
                        <div class="text-3xl mb-2">📚</div>
                        <p class="text-xs font-bold text-slate-400">No chapters mapped for ${sub} yet.</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = "";
            chapters.forEach(chap => {
                const diffColor = chap.difficulty === 'Easy' ? 'text-emerald-500 bg-emerald-50 dark:bg-emerald-950/30' : 
                                 (chap.difficulty === 'Hard' ? 'text-rose-500 bg-rose-50 dark:bg-rose-950/30' : 
                                  'text-amber-500 bg-amber-50 dark:bg-amber-950/30');

                list.innerHTML += `
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-sm flex flex-col justify-between hover:border-blue-500/50 transition duration-300">
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <span class="${diffColor} text-[9px] font-black uppercase tracking-widest px-3 py-1 rounded-full border border-current opacity-80">${chap.difficulty || 'Medium'}</span>
                                <span class="text-xs text-slate-400 font-bold font-mono">${chap.estimated_time_mins || 45} Mins Est.</span>
                            </div>
                            <h3 class="text-lg font-black text-slate-800 dark:text-white leading-snug">${chap.name}</h3>
                            <p class="text-xs font-bold text-slate-400 mt-2 flex items-center gap-1">
                                <span class="text-blue-500">📝</span> ${chap.question_count || 0} Practice Questions
                            </p>
                        </div>
                        <div class="mt-6 flex justify-between items-center border-t border-slate-100 dark:border-slate-800 pt-4">
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Status: Ready</span>
                            <button onclick="startChapterPractice('${chap.id}')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-black uppercase tracking-wider px-5 py-2.5 rounded-xl transition shadow-md shadow-blue-500/10 flex items-center gap-1.5">
                                <span>Start Practice</span>
                                <span>➔</span>
                            </button>
                        </div>
                    </div>
                `;
            });
        })
        .catch(err => {
            document.getElementById('chapter-list').innerHTML = `
                <div class="col-span-full bg-rose-50 dark:bg-rose-950/20 border border-rose-200 dark:border-rose-900 rounded-2xl p-6 text-center text-rose-600 text-xs font-bold">
                    Failed to load chapters for ${sub}.
                </div>
            `;
        });

    function startChapterPractice(chapterId) {
        // Redirect to exam arena or chapter practice endpoint
        window.location.href = `/exam/${chapterId}`;
    }
</script>
{% endblock %}
