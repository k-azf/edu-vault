{% extends 'base.html' %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    
    <!-- Back Navigation -->
    <div class="mb-6">
        <a href="/subject/{{ subject }}" class="inline-flex items-center gap-2 text-sm font-bold text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition">
            <span>←</span>
            <span>Back to {{ subject }} Hub</span>
        </a>
    </div>

    <!-- Header -->
    <div class="mb-8">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-black text-slate-800 dark:text-white tracking-tight">
                    {{ subject }} Chapters
                </h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                    Browse units and sections. Choose a practice or exam mode to start a chapter.
                </p>
            </div>
            <div class="flex items-center gap-3">
                <select id="grade-selector" onchange="loadChapters()" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm font-bold dark:text-white outline-none focus:ring-2 focus:ring-blue-500 transition">
                    <option value="9">Grade 9</option>
                    <option value="10">Grade 10</option>
                    <option value="11">Grade 11</option>
                    <option value="12" selected>Grade 12</option>
                </select>
                <button onclick="loadChapters()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition flex items-center gap-1.5 shadow-sm shadow-blue-500/20">
                    <span>🔄</span> Refresh
                </button>
            </div>
        </div>

    </div>

    <!-- Stats Summary -->
    <div id="stats-summary" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 text-center">
            <div class="text-2xl font-black text-blue-600 dark:text-blue-400" id="stat-units">-</div>
            <div class="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider">Units</div>
        </div>
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 text-center">
            <div class="text-2xl font-black text-emerald-600 dark:text-emerald-400" id="stat-sections">-</div>
            <div class="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider">Sections</div>
        </div>
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 text-center">
            <div class="text-2xl font-black text-amber-600 dark:text-amber-400" id="stat-questions">-</div>
            <div class="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider">Questions</div>
        </div>
    </div>

    <!-- Search & Filter -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 mb-6">
        <div class="flex flex-wrap gap-3">
            <div class="flex-grow min-w-[200px]">
                <input type="text" id="chapter-search" placeholder="Search by unit or section..." 
                       oninput="filterChapters()" 
                       class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm dark:text-white outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
            <select id="chapter-category-filter" onchange="filterChapters()" aria-label="Filter chapters by category" class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm font-bold dark:text-white outline-none focus:ring-2 focus:ring-blue-500 transition">
                <option value="all">All Chapter Categories</option>
            </select>
            <button onclick="resetFilters()" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold px-4 py-2.5 rounded-xl transition">
                Reset Filters
            </button>
        </div>
    </div>

    <!-- Chapter Grid -->
    <div id="chapter-list" class="space-y-6">
        <!-- Loading Skeleton -->
        <div class="animate-pulse">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 h-32"></div>
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 h-32 mt-4"></div>
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 h-32 mt-4"></div>
        </div>
    </div>

    <!-- No Results Message -->
    <div id="no-results" class="hidden bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 text-center">
        <div class="text-4xl mb-3">🔍</div>
        <h3 class="text-lg font-bold text-slate-800 dark:text-white">No matching chapters found</h3>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Try adjusting your search or filters.</p>
        <button onclick="resetFilters()" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-6 py-2.5 rounded-xl transition">
            Reset Filters
        </button>
    </div>

</div>

<!-- ============================================ -->
<!-- JAVASCRIPT -->
<!-- ============================================ -->
<script>
    // ============================================
    // STATE
    // ============================================
    let currentChapters = [];
    let filteredChapters = [];
    let selectedUnitCategory = 'all';

    // ============================================
    // LOAD CHAPTERS
    // ============================================
    function loadChapters() {
        const subject = "{{ subject }}";
        const grade = document.getElementById('grade-selector').value;
        
        const list = document.getElementById('chapter-list');
        list.innerHTML = `
            <div class="animate-pulse">
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 h-32"></div>
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 h-32 mt-4"></div>
            </div>
        `;

        // Reset stats
        document.getElementById('stat-units').textContent = '-';
        document.getElementById('stat-sections').textContent = '-';
        document.getElementById('stat-questions').textContent = '-';

        fetch(`/api/curriculum/${encodeURIComponent(subject)}/${grade}`)
            .then(res => {
                if (!res.ok) throw new Error(`Server returned HTTP ${res.status}`);
                return res.json();
            })
            .then(data => {
                if (!Array.isArray(data)) throw new Error('The curriculum API returned an invalid response.');
                currentChapters = data;
                filteredChapters = data;
                selectedUnitCategory = 'all';
                populateChapterCategories(data);
                filterChapters();
                updateStats(data);
            })
            .catch(err => {
                console.error('Error loading chapters:', err);
                list.innerHTML = `
                    <div class="bg-rose-50 dark:bg-rose-950/20 border border-rose-200 dark:border-rose-900 rounded-2xl p-8 text-center">
                        <div class="text-3xl mb-2">❌</div>
                        <p class="text-sm font-bold text-rose-600 dark:text-rose-400">Failed to load chapters</p>
                        <p class="text-xs text-rose-500 dark:text-rose-300 mt-1">${err.message}</p>
                        <button onclick="loadChapters()" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition">
                            Try Again
                        </button>
                    </div>
                `;
            });
    }

    // ============================================
    // RENDER CHAPTERS
    // ============================================
    function renderChapters(chapters) {
        const list = document.getElementById('chapter-list');
        const noResults = document.getElementById('no-results');

        if (!chapters || chapters.length === 0) {
            list.innerHTML = '';
            noResults.classList.remove('hidden');
            return;
        }
        noResults.classList.add('hidden');

        list.innerHTML = '';
        
        chapters.forEach((unit, index) => {
            const totalQuestions = unit.sections ? Object.values(unit.sections).reduce((sum, section) => sum + (section.question_count || 0), 0) : 0;

            const hasQuestions = totalQuestions > 0;

            list.innerHTML += `
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition">
                    <!-- Unit Header -->
                    <div class="p-6 bg-gradient-to-r from-blue-50/50 to-indigo-50/50 dark:from-blue-950/20 dark:to-indigo-950/20 border-b border-slate-200 dark:border-slate-800">
                        <div class="flex flex-wrap items-center justify-between gap-4">
                            <div class="flex items-center gap-4">
                                <div class="bg-blue-600 text-white font-black text-sm w-10 h-10 rounded-xl flex items-center justify-center">
                                    ${unit.unit_number || index + 1}
                                </div>
                                <div>
                                    <h2 class="text-lg font-black text-slate-800 dark:text-white">${unit.unit_title || 'Unit ' + (unit.unit_number || index + 1)}</h2>
                                    <div class="flex flex-wrap items-center gap-3 text-xs text-slate-500 dark:text-slate-400">
                                        <span>📚 ${Object.keys(unit.sections || {}).length} sections</span>
                                        <span>•</span>
                                        <span>📝 ${totalQuestions} questions</span>
                                        ${totalQuestions > 0 ? `<span class="text-emerald-600 dark:text-emerald-400 font-bold">✅ Available</span>` : `<span class="text-amber-600 dark:text-amber-400">⏳ No questions yet</span>`}
                                    </div>
                                </div>
                            </div>
                            ${hasQuestions ? `
                                <button onclick="startUnitPractice('${unit.id}')" 
                                        class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition shadow-sm shadow-blue-500/20 flex items-center gap-1.5">
                                    <span>▶️</span> Choose Mode
                                </button>
                            ` : `
                                <span class="text-xs text-slate-400 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-xl">No questions available</span>
                            `}
                        </div>
                    </div>

                    <!-- Sections -->
                    <div class="p-4 space-y-3">
                        ${unit.sections && Object.keys(unit.sections).length > 0 ? 
                            Object.values(unit.sections).map(section => {
                                const sectionQuestions = section.question_count || 0;
                                return `
                                    <div class="border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden">
                                        <!-- Section Header -->
                                        <div class="p-4 bg-slate-50 dark:bg-slate-950/50 flex flex-wrap items-center justify-between gap-3">
                                            <div class="flex items-center gap-3">
                                                <span class="bg-indigo-100 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-400 font-bold text-xs w-8 h-8 rounded-lg flex items-center justify-center">${section.section_number || '•'}</span>
                                                <div>
                                                    <h3 class="text-sm font-bold text-slate-800 dark:text-white">${section.section_title || 'Section ' + (section.section_number || '')}</h3>
                                                    <span class="text-[10px] text-slate-500 dark:text-slate-400">📝 ${sectionQuestions} questions</span>
                                                </div>
                                            </div>
                                            ${sectionQuestions > 0 ? `
                                                <button onclick="startSectionPractice('${section.id}')" 
                                                        class="bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg transition">
                                                    Choose Mode
                                                </button>
                                            ` : `
                                                <span class="text-[10px] text-slate-400">No questions</span>
                                            `}
                                        </div>

                                    </div>
                                `;
                            }).join('') : 
                            `<div class="text-center text-xs text-slate-400 py-4">No sections available</div>`
                        }
                    </div>
                </div>
            `;
        });
    }

    // ============================================
    // UPDATE STATS
    // ============================================
    function updateStats(chapters) {
        let totalUnits = 0;
        let totalSections = 0;
        let totalQuestions = 0;

        chapters.forEach(unit => {
            totalUnits++;
            if (unit.sections) {
                const sections = Object.values(unit.sections);
                totalSections += sections.length;
                sections.forEach(section => {
                    totalQuestions += section.question_count || 0;
                });
            }
        });

        document.getElementById('stat-units').textContent = totalUnits;
        document.getElementById('stat-sections').textContent = totalSections;
        document.getElementById('stat-questions').textContent = totalQuestions;
    }

    // ============================================
    // FILTER CHAPTERS
    // ============================================
    function populateChapterCategories(chapters) {
        const selector = document.getElementById('chapter-category-filter');
        if (!selector) return;
        const previous = selectedUnitCategory;
        const categories = chapters.map(unit => ({
            id: String(unit.id),
            title: unit.unit_title || `Unit ${unit.unit_number || ''}`.trim()
        }));
        selector.innerHTML = '<option value="all">All Chapter Categories</option>';
        categories.forEach(category => {
            const option = document.createElement('option');
            option.value = category.id;
            option.textContent = category.title;
            selector.appendChild(option);
        });
        selector.value = categories.some(category => category.id === previous) ? previous : 'all';
        selectedUnitCategory = selector.value;
    }

    function filterChapters() {
        const searchInput = document.getElementById('chapter-search');
        const categorySelector = document.getElementById('chapter-category-filter');
        const search = (searchInput?.value || '').toLowerCase().trim();
        selectedUnitCategory = categorySelector?.value || 'all';

        const filtered = currentChapters.map(unit => {
            if (selectedUnitCategory !== 'all' && String(unit.id) !== selectedUnitCategory) return null;

            const unitTitle = String(unit.unit_title || '').toLowerCase();
            const unitMatches = !search || unitTitle.includes(search);
            const unitCopy = { ...unit, sections: {} };
            let hasMatch = unitMatches;

            Object.entries(unit.sections || {}).forEach(([key, section]) => {
                const sectionTitle = String(section.section_title || '').toLowerCase();
                const sectionMatches = !search || sectionTitle.includes(search);
                if (sectionMatches || unitMatches) {
                    unitCopy.sections[key] = section;
                    hasMatch = true;
                }
            });

            return hasMatch ? unitCopy : null;
        }).filter(Boolean);

        filteredChapters = filtered;
        renderChapters(filtered);
    }

    function resetFilters() {
        document.getElementById('chapter-search').value = '';
        const categorySelector = document.getElementById('chapter-category-filter');
        if (categorySelector) categorySelector.value = 'all';
        selectedUnitCategory = 'all';
        filterChapters();
    }

    // ============================================
    async function openCurriculumPractice(scopeType, scopeId) {
        try {
            const response = await fetch('/api/curriculum/practice-exams', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({scope_type: scopeType, scope_id: scopeId})
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Could not open this chapter practice.');
            window.location.assign(data.exam_url);
        } catch (error) {
            window.alert(error.message || 'Could not open this chapter practice.');
        }
    }

    function startUnitPractice(unitId) {
        openCurriculumPractice('unit', unitId);
    }

    function startSectionPractice(sectionId) {
        openCurriculumPractice('section', sectionId);
    }
    // UTILITY FUNCTIONS
    // ============================================
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    console.log('📚 Chapter practice module initialized!');
</script>

{% endblock %}
