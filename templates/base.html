<!DOCTYPE html>
<html lang="en">
<head>
    <!-- PWA Manifest & Theme Color -->

<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduVault - CBT Portal</title>
    
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>
    
<!-- LaTeX Support via KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {
    delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
    ],
    throwOnError: false
});"></script>
<!-- Reuse the project's existing rich-text sanitization dependency for exam content. -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>


    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .exam-rich-content { color: inherit; line-height: 1.75; overflow-wrap: anywhere; }
        .exam-rich-content p { margin: 0 0 0.85rem; }
        .exam-rich-content p:last-child { margin-bottom: 0; }
        .exam-rich-content h1, .exam-rich-content h2, .exam-rich-content h3,
        .exam-rich-content h4, .exam-rich-content h5, .exam-rich-content h6 {
            margin: 1rem 0 0.55rem; font-weight: 800; line-height: 1.3;
        }
        .exam-rich-content h1 { font-size: 1.35rem; }
        .exam-rich-content h2 { font-size: 1.2rem; }
        .exam-rich-content h3, .exam-rich-content h4 { font-size: 1.05rem; }
        .exam-rich-content ul, .exam-rich-content ol { margin: 0.6rem 0 0.9rem; padding-left: 1.5rem; }
        .exam-rich-content li { margin: 0.25rem 0; }
        .exam-rich-content u { text-decoration-thickness: 0.12em; text-underline-offset: 0.16em; }
        .exam-rich-table-wrap { max-width: 100%; overflow-x: auto; margin: 1rem 0; -webkit-overflow-scrolling: touch; }
        .exam-rich-content table { width: 100%; min-width: 32rem; border-collapse: collapse; font-size: 0.9em; }
        .exam-rich-content th, .exam-rich-content td { border: 1px solid #cbd5e1; padding: 0.65rem 0.75rem; text-align: left; vertical-align: top; }
        .exam-rich-content th { background: #f1f5f9; font-weight: 800; }
        .dark .exam-rich-content th { background: #1e293b; }
        .dark .exam-rich-content th, .dark .exam-rich-content td { border-color: #475569; }
        .exam-rich-content img { display: block; max-width: 100%; height: auto; margin: 1rem auto; border-radius: 0.75rem; object-fit: contain; }
        .exam-rich-content .katex-display { max-width: 100%; overflow-x: auto; overflow-y: hidden; padding: 0.35rem 0; }
        .exam-rich-content .katex { font-size: 1.05em; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Global Nav -->
    <nav class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white rounded-xl p-2.5 shadow-md">
                <span class="font-extrabold tracking-wider text-sm font-mono">EV</span>
            </div>
            <a href="/" class="text-xl font-extrabold tracking-tight text-slate-800 dark:text-white">EduVault</a>
        </div>
        <div class="flex items-center space-x-6">
            <button onclick="toggleDarkMode()" class="text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white">
                <!-- Theme Toggle Icon -->
                <svg id="theme-toggle" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
            {% if session.get('user_id') %}
                <span class="text-xs font-semibold bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-lg">Student: <b class="text-blue-600">{{ session.get('username') }}</b></span>
                <a href="/logout" class="text-xs font-bold text-red-600 hover:underline">Sign Out</a>
            {% endif %}
        </div>
    </nav>

    <!-- Content Area -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <script>
        // Dark Mode Logic
        if (localStorage.getItem('dark-mode') === 'true' || (!('dark-mode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('dark-mode', 'false');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('dark-mode', 'true');
            }
        }
    </script>
    <!-- Register EduVault Offline Engine -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('EduVault Offline Mode Ready! Scope:', reg.scope))
                .catch(err => console.error('Offline Registration Failed:', err));
        });
    }

    // Auto-Sync Exam Data to LocalStorage when online
    async function syncOfflineData() {
        if (navigator.onLine) {
            try {
                const res = await fetch('/api/exams');
                const exams = await res.json();
                localStorage.setItem('eduvault_cached_exams', JSON.stringify(exams));
                console.log('Exams synced for offline use!');
            } catch (e) {
                console.log('Offline sync skipped.');
            }
        }
    }
    window.addEventListener('online', syncOfflineData);
    document.addEventListener('DOMContentLoaded', syncOfflineData);
</script>

</body>
</html>
