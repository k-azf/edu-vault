{% extends 'base.html' %}
{% block content %}
<main class="min-h-screen bg-slate-50 px-4 py-10 dark:bg-slate-950">
  <article class="mx-auto max-w-5xl space-y-6">
    <header class="rounded-3xl bg-gradient-to-r from-indigo-950 to-violet-900 p-7 text-white shadow-xl sm:p-9">
      <p class="text-xs font-black uppercase tracking-[.2em] text-violet-200">EduVault | Saved explanation resource</p>
      <h1 class="mt-3 text-3xl font-black">{{ result.title or result.subject or 'Exam Explanation' }}</h1>
      <p class="mt-1 text-xs text-indigo-200">Saved {{ saved_at }}</p>
    </header>
    {% if pdf_url %}
    <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <iframe class="h-[82vh] min-h-[560px] w-full" src="{{ pdf_url }}#toolbar=0&navpanes=0" title="Saved exam explanation PDF" loading="lazy" referrerpolicy="same-origin"></iframe>
    </section>
    {% else %}
    <section class="rounded-2xl border border-amber-200 bg-amber-50 p-5 text-sm font-semibold text-amber-900">The saved explanation PDF is unavailable.</section>
    {% endif %}
    <a href="/resources/explanations" class="inline-flex rounded-xl bg-violet-700 px-5 py-3 font-bold text-white hover:bg-violet-600">Back to Exam Explanations</a>
  </article>
</main>
{% endblock %}
