<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<title>EduVault • 6 Subject Entrance Exam</title>
<style>
:root{
  --bg:#0f172a;--bg-soft:#111c32;--card:#1e293b;--card-2:#243247;
  --text:#f8fafc;--muted:#94a3b8;--cyan:#38bdf8;--blue:#6366f1;
  --purple:#8b5cf6;--pink:#ec4899;--good:#34d399;--bad:#fb7185;
  --warn:#fbbf24;--line:rgba(255,255,255,.08);
  --shadow:0 10px 30px rgba(56,189,248,.1);--radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  margin:0;min-height:100vh;color:var(--text);line-height:1.5;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(56,189,248,.08),transparent 30%),
    radial-gradient(circle at 85% 15%,rgba(99,102,241,.09),transparent 32%),
    linear-gradient(180deg,#0f172a,#111827 50%,#0f172a);
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 50% 100%,rgba(139,92,246,.06),transparent 35%);
}
button,input,select{font:inherit}
button{border:0;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
::selection{background:rgba(56,189,248,.28);color:#fff}

.app{width:100%;max-width:1050px;margin:auto;padding:16px}

.top{
  position:sticky;top:0;z-index:20;
  background:rgba(15,23,42,.8);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:10px 0 14px;
  box-shadow:0 8px 30px rgba(0,0,0,.2);
}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;color:var(--text)}
.mark{
  width:42px;height:42px;display:grid;place-items:center;border-radius:13px;
  background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font-weight:950;
  box-shadow:0 8px 25px rgba(56,189,248,.25),0 0 20px rgba(99,102,241,.18);
  transition:transform .25s ease,box-shadow .25s ease;
}
.mark:hover{transform:rotate(-4deg) scale(1.05);box-shadow:0 10px 30px rgba(56,189,248,.35),0 0 30px rgba(99,102,241,.25)}

.status{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:7px 11px;
  border-radius:99px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.2);
  color:var(--good);font-weight:800;box-shadow:0 0 18px rgba(52,211,153,.08)
}
.offline{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.2);color:var(--warn)}

nav{display:flex;gap:8px;overflow:auto;padding-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  position:relative;background:transparent;color:var(--muted);padding:9px 13px;border-radius:11px;
  font-weight:750;white-space:nowrap;border:1px solid transparent;
  transition:color .25s ease,background .25s ease,border-color .25s ease,transform .25s ease,box-shadow .25s ease
}
nav button:hover{color:var(--text);background:rgba(255,255,255,.05);border-color:var(--line);transform:translateY(-1px)}
nav button:active{transform:scale(.96)}
nav button.active{
  color:#fff;background:linear-gradient(135deg,rgba(56,189,248,.22),rgba(99,102,241,.3));
  border-color:rgba(56,189,248,.25);
  box-shadow:0 0 20px rgba(56,189,248,.12),inset 0 1px 0 rgba(255,255,255,.08)
}

main{padding-top:18px}
.hero{
  position:relative;overflow:hidden;color:#fff;border-radius:25px;padding:25px;margin-bottom:18px;
  background:
    radial-gradient(circle at 90% 10%,rgba(56,189,248,.25),transparent 35%),
    radial-gradient(circle at 10% 100%,rgba(139,92,246,.22),transparent 35%),
    linear-gradient(135deg,#172554,#1e1b4b 55%,#0f172a);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 18px 45px rgba(0,0,0,.28),0 0 35px rgba(56,189,248,.08)
}
.hero::after{
  content:"";position:absolute;width:180px;height:180px;right:-70px;top:-80px;border-radius:50%;
  background:radial-gradient(circle,rgba(56,189,248,.15),transparent 70%);pointer-events:none
}
.hero h1{position:relative;z-index:1;margin:0 0 6px;font-size:clamp(27px,6vw,42px);line-height:1.1;letter-spacing:-1px}
.hero p{position:relative;z-index:1;margin:0;color:#cbd5e1}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  position:relative;background:linear-gradient(145deg,rgba(30,41,59,.96),rgba(15,23,42,.94));
  border:1px solid rgba(255,255,255,.08);border-radius:19px;padding:18px;
  box-shadow:var(--shadow);
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease,background .25s ease
}
.card:hover{
  transform:translateY(-2px);border-color:rgba(56,189,248,.16);
  box-shadow:0 15px 38px rgba(0,0,0,.28),0 0 25px rgba(56,189,248,.07)
}
.card h2,.card h3{margin:0 0 10px;color:var(--text)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.field{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.field label{font-weight:750;font-size:13px;color:#cbd5e1}
.field input,.field select{
  width:100%;padding:12px 13px;border:1px solid rgba(255,255,255,.1);border-radius:12px;
  outline:none;background:rgba(15,23,42,.75);color:var(--text);
  transition:border-color .25s ease,box-shadow .25s ease,background .25s ease,transform .25s ease
}
.field input::placeholder{color:#64748b}
.field input:hover,.field select:hover{border-color:rgba(56,189,248,.2)}
.field input:focus,.field select:focus{
  border-color:var(--cyan);background:rgba(15,23,42,.95);
  box-shadow:0 0 0 3px rgba(56,189,248,.3),0 0 20px rgba(56,189,248,.08)
}
.field select option{background:#1e293b;color:#f8fafc}

.primary,.secondary,.danger{
  border-radius:12px;font-weight:800;
  transition:transform .18s ease,box-shadow .25s ease,border-color .25s ease,background .25s ease
}
.primary{
  background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;padding:12px 17px;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 8px 22px rgba(99,102,241,.2),0 0 20px rgba(56,189,248,.08)
}
.primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(99,102,241,.28),0 0 25px rgba(56,189,248,.14)}
.primary:active,.secondary:active,.danger:active{transform:scale(.97)}
.secondary{
  background:rgba(56,189,248,.08);color:var(--cyan);padding:11px 15px;
  border:1px solid rgba(56,189,248,.16)
}
.secondary:hover{background:rgba(56,189,248,.14);border-color:rgba(56,189,248,.3);box-shadow:0 0 20px rgba(56,189,248,.08)}
.danger{
  background:rgba(251,113,133,.08);color:var(--bad);padding:11px 15px;
  border:1px solid rgba(251,113,133,.16)
}
.danger:hover{background:rgba(251,113,133,.14);border-color:rgba(251,113,133,.3);box-shadow:0 0 20px rgba(251,113,133,.08)}

.small{font-size:12px}
.pill{
  display:inline-flex;align-items:center;padding:5px 9px;border-radius:99px;
  background:rgba(56,189,248,.09);border:1px solid rgba(56,189,248,.14);
  color:var(--cyan);font-size:12px;font-weight:800
}

.subject{
  display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px;
  border:1px solid rgba(255,255,255,.07);border-radius:15px;margin:9px 0;
  background:rgba(15,23,42,.45);
  transition:transform .25s ease,border-color .25s ease,background .25s ease,box-shadow .25s ease
}
.subject:hover{
  transform:translateY(-2px);border-color:rgba(56,189,248,.16);
  background:rgba(30,41,59,.72);box-shadow:0 8px 25px rgba(0,0,0,.2)
}
.subject strong{font-size:16px;color:var(--text)}
.score{font-weight:900;color:var(--cyan)}

.notice{padding:12px 14px;border-radius:13px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.16);color:#fcd34d}
.ok{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.18);color:#6ee7b7}
.error{background:rgba(251,113,133,.08);border-color:rgba(251,113,133,.18);color:#fda4af}
.hidden{display:none!important}

.exambar{
  position:sticky;top:88px;z-index:10;display:flex;justify-content:space-between;align-items:center;
  gap:10px;padding:12px;margin-bottom:14px;background:rgba(15,23,42,.82);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.09);border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.25),0 0 25px rgba(56,189,248,.06)
}

.timer{
  display:inline-flex;align-items:center;justify-content:center;min-width:86px;padding:7px 12px;
  border-radius:10px;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-size:20px;font-weight:950;letter-spacing:1px;color:var(--cyan);
  background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.25);
  box-shadow:0 0 15px rgba(56,189,248,.12),inset 0 0 12px rgba(56,189,248,.04);
  text-shadow:0 0 10px rgba(56,189,248,.65);
  transition:color .25s ease,border-color .25s ease,box-shadow .25s ease
}
.timer.warn{color:var(--warn);border-color:rgba(251,191,36,.3);box-shadow:0 0 18px rgba(251,191,36,.12);text-shadow:0 0 10px rgba(251,191,36,.55)}
.timer.crit{
  color:var(--bad);border-color:rgba(251,113,133,.38);animation:timerPulse 1s infinite;
  text-shadow:0 0 12px rgba(251,113,133,.65)
}
@keyframes timerPulse{0%,100%{box-shadow:0 0 12px rgba(251,113,133,.1)}50%{box-shadow:0 0 25px rgba(251,113,133,.3)}}

.q{font-size:18px;line-height:1.5;font-weight:800;margin-bottom:14px;color:var(--text)}
.opt{
  position:relative;display:flex;gap:10px;align-items:flex-start;padding:13px;
  border:1px solid rgba(255,255,255,.08);border-radius:13px;margin:8px 0;
  background:rgba(15,23,42,.55);color:#e2e8f0;cursor:pointer;
  transition:all .25s ease
}
.opt:hover{
  transform:translateY(-2px);border-color:rgba(56,189,248,.25);background:rgba(30,41,59,.85);
  box-shadow:0 8px 22px rgba(0,0,0,.2),0 0 18px rgba(56,189,248,.06)
}
.opt:has(input:checked){
  transform:translateY(-2px);border-color:rgba(56,189,248,.65);
  background:linear-gradient(135deg,rgba(56,189,248,.13),rgba(99,102,241,.16));
  box-shadow:0 0 0 1px rgba(56,189,248,.1),0 0 24px rgba(56,189,248,.16),inset 0 0 20px rgba(56,189,248,.04);
  color:#fff
}
.opt input{margin-top:4px;accent-color:var(--cyan);cursor:pointer}

.progress{
  position:relative;height:9px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;
  margin:10px 0;border:1px solid rgba(255,255,255,.05)
}
.progress i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#38bdf8,#8b5cf6,#ec4899);
  background-size:200% 100%;animation:progressGlow 3s linear infinite;
  box-shadow:0 0 12px rgba(56,189,248,.35);transition:width .4s ease
}
@keyframes progressGlow{0%{background-position:0 50%}100%{background-position:200% 50%}}

.resultHero{
  position:relative;overflow:hidden;text-align:center;padding:22px;border-radius:20px;
  background:radial-gradient(circle at 50% 0%,rgba(56,189,248,.13),transparent 45%),linear-gradient(135deg,rgba(30,41,59,.96),rgba(15,23,42,.96));
  border:1px solid rgba(56,189,248,.12);
  box-shadow:0 15px 40px rgba(0,0,0,.25),0 0 30px rgba(56,189,248,.07)
}
.resultHero h2{color:var(--text)}
.bigscore{
  font-size:52px;font-weight:950;line-height:1.1;margin:8px 0;
  background:linear-gradient(90deg,#38bdf8,#8b5cf6,#ec4899);
  background-size:200% auto;background-clip:text;-webkit-background-clip:text;color:transparent;
  animation:scoreGradient 4s linear infinite;filter:drop-shadow(0 0 12px rgba(56,189,248,.18))
}
@keyframes scoreGradient{0%{background-position:0 50%}100%{background-position:200% 50%}}

.table{width:100%;border-collapse:collapse;color:var(--text)}
.table th,.table td{padding:11px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left}
.table th{color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.table tr{transition:background .2s ease}.table tr:hover{background:rgba(56,189,248,.035)}

.avatar{
  width:78px;height:78px;border-radius:50%;object-fit:cover;
  border:3px solid rgba(56,189,248,.5);box-shadow:0 0 20px rgba(56,189,248,.16);
  transition:transform .25s ease,box-shadow .25s ease
}
.avatar:hover{transform:scale(1.04);box-shadow:0 0 28px rgba(56,189,248,.28)}

.footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}

.toast{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(15px);
  background:rgba(15,23,42,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:#fff;padding:12px 16px;border-radius:12px;border:1px solid rgba(56,189,248,.18);
  z-index:99;display:none;max-width:90%;
  box-shadow:0 12px 35px rgba(0,0,0,.35),0 0 20px rgba(56,189,248,.08);
  animation:toastIn .25s ease forwards
}
@keyframes toastIn{to{transform:translateX(-50%) translateY(0)}}


/* ===== FINAL ENTRANCE RESULT CARD ===== */
.finalResultWrap{max-width:760px;margin:0 auto;padding-bottom:28px}
.finalResultCard{background:#fff;color:#172033;border-radius:26px;overflow:hidden;box-shadow:0 20px 55px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.45)}
.finalResultHead{position:relative;height:205px;background:linear-gradient(135deg,#6157d8,#5147c7);padding:30px 28px 20px 350px;color:#fff}
.finalResultHead:after{content:"";position:absolute;inset:auto 0 0 0;height:72px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff)}
.finalResultPhoto{position:absolute;left:38px;top:28px;width:190px;height:190px;border-radius:50%;object-fit:cover;background:#fff;border:7px solid #fff;box-shadow:0 5px 22px rgba(0,0,0,.18);z-index:2}
.finalResultPhotoEmpty{position:absolute;left:38px;top:28px;width:190px;height:190px;border-radius:50%;display:grid;place-items:center;background:#eef1f7;color:#64748b;border:7px solid #fff;font-size:58px;z-index:2}
.finalResultName{position:relative;z-index:3;margin:20px 0 3px;font-size:29px;font-weight:950;letter-spacing:.3px;text-transform:uppercase}
.finalResultUni{position:relative;z-index:3;font-size:18px;color:#e5e7ff;font-weight:700}
.finalResultBody{padding:28px 38px 34px}
.finalInfo{margin-top:0;border-top:1px solid #e5e7eb}
.finalInfoRow{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid #edf0f5;font-size:18px}
.finalInfoLabel{color:#475569;font-weight:650}
.finalInfoValue{font-weight:850;color:#111827;text-align:right}
.finalScoreGrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:26px 0}
.finalScoreBox{border-radius:20px;padding:22px 16px;text-align:center;color:#fff;background:linear-gradient(135deg,#4155e8,#18a6e8);box-shadow:0 10px 24px rgba(31,99,210,.2)}
.finalScoreLabel{font-size:16px;font-weight:900;letter-spacing:1px}
.finalScoreValue{font-size:42px;font-weight:950;line-height:1.05;margin-top:7px}
.finalSubjects{margin-top:12px}
.finalSubjectRow{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px 4px;border-bottom:1px solid #edf0f5;font-size:19px}
.finalSubjectName{font-weight:750;color:#172033}
.finalSubjectScore{min-width:108px;text-align:center;padding:7px 13px;border-radius:999px;background:#eafff2;border:1px solid #c8efd7;color:#08783d;font-weight:900}
.finalResultLocked{max-width:760px;margin:0 auto}
.finalLockedIcon{font-size:44px;margin-bottom:8px}
.finalLockedTitle{font-size:25px;font-weight:950;margin:0 0 7px}
.finalLockedText{color:#94a3b8;margin:0}
.subjectSubmitted{display:inline-flex;align-items:center;gap:6px;margin-top:6px;color:#059669;font-weight:900;font-size:12px}
.downloadResultBtn{width:100%;margin-top:14px;background:linear-gradient(135deg,#16a34a,#0ea5e9);color:#fff;padding:14px 18px;border-radius:14px;font-weight:900;box-shadow:0 10px 24px rgba(14,165,233,.2)}
.downloadResultBtn:active{transform:scale(.98)}
@media(max-width:700px){
 .finalResultHead{height:175px;padding:22px 18px 10px 170px}
 .finalResultPhoto,.finalResultPhotoEmpty{left:18px;top:22px;width:140px;height:140px}
 .finalResultName{font-size:20px;margin-top:20px}
 .finalResultUni{font-size:14px}
 .finalResultBody{padding:22px 18px 26px}
 .finalInfoRow{font-size:15px}
 .finalScoreGrid{gap:10px}
 .finalScoreValue{font-size:31px}
 .finalSubjectRow{font-size:16px}
 .finalSubjectScore{min-width:88px}
}

@media(max-width:700px){
  .app{padding:10px}.hero{padding:20px;border-radius:20px}.hero h1{font-size:30px}
  .exambar{top:84px}.g3{grid-template-columns:1fr}.bigscore{font-size:43px}.card{border-radius:17px}
  .subject{align-items:flex-start}
}
@media(max-width:480px){
  .brand{align-items:flex-start}.logo{font-size:17px}.mark{width:38px;height:38px}
  nav button{padding:8px 11px;font-size:13px}.exambar{padding:10px}.timer{min-width:78px;font-size:17px}.q{font-size:17px}.opt{padding:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ===== MOBILE EXAM EXPERIENCE ===== */
.examShell{max-width:760px;margin:auto}
.examTop{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 0 18px
}
.examBrand{display:flex;align-items:center;gap:10px}
.examBrand .examName{font-weight:950;font-size:20px;line-height:1.1}
.examBrand .examSub{font-size:12px;color:var(--muted);font-weight:800;margin-top:3px}
.timeCard{
  min-width:190px;padding:12px 18px;border-radius:18px;
  background:linear-gradient(145deg,rgba(30,41,59,.98),rgba(15,23,42,.98));
  border:1px solid rgba(255,255,255,.1)
}
.timeLabel{font-size:12px;letter-spacing:1.4px;font-weight:950;color:#cbd5e1}
.timeCard .timer{padding:0;min-width:0;border:0;background:transparent;box-shadow:none;color:#fff;font-size:22px}
.examCard{padding:20px;border-radius:28px}
.questionMeta{display:flex;justify-content:space-between;gap:10px;color:#cbd5e1;font-size:13px;letter-spacing:.4px}
.examActions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;position:relative;z-index:40}.examActions button,.navigator button{position:relative;z-index:41;pointer-events:auto}
.examActions .wide{grid-column:1/-1}
.markedBtn{border-color:rgba(251,191,36,.45)!important;color:#fcd34d!important;background:rgba(251,191,36,.08)!important}
.navigator{margin-top:20px}
.navGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.qNavBtn{
  min-height:54px;border-radius:12px;background:#1e293b;color:#e2e8f0;
  border:1px solid rgba(255,255,255,.04);font-weight:800;font-size:17px
}
.qNavBtn.current{outline:2px solid var(--cyan);background:linear-gradient(135deg,rgba(56,189,248,.22),rgba(99,102,241,.22));color:#fff}
.qNavBtn.answered{border-color:rgba(52,211,153,.6);box-shadow:inset 0 0 0 1px rgba(52,211,153,.14)}
.qNavBtn.marked{border-color:rgba(251,191,36,.8);box-shadow:0 0 0 1px rgba(251,191,36,.16)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0;color:var(--muted);font-size:12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;background:#1e293b;border:1px solid rgba(255,255,255,.1)}
.legend .lAnswered::before{background:var(--good)}.legend .lCurrent::before{background:var(--cyan)}.legend .lMarked::before{background:var(--warn)}
.deviceNotice{margin-top:14px}
@media(max-width:700px){
  .examTop{position:sticky;top:0;z-index:15;background:rgba(15,23,42,.96);padding:10px 0;backdrop-filter:blur(14px)}
  .examBrand .examName{font-size:18px}.timeCard{min-width:145px;padding:9px 12px;border-radius:14px}
  .timeCard .timer{font-size:19px}.examCard{padding:16px;border-radius:22px}
  .q{font-size:21px;line-height:1.55}.opt{min-height:74px;padding:18px 15px;border-radius:20px;font-size:18px}
  .examActions{grid-template-columns:1fr 1fr}.navGrid{gap:8px}.qNavBtn{min-height:52px}
}

// The EduVault app has its own student/admin login UI. Anonymous Firebase Auth
// supplies a Firebase identity so Firestore Rules can safely require request.auth.
async function ensureFirebaseAuth(){
  if(!firebaseInitialized || !db || !auth || !navigator.onLine){
    return false;
  }
  if(auth.currentUser) return true;
  if(firebaseAuthPromise) return firebaseAuthPromise;
  firebaseAuthPromise=(async()=>{
    try{
      await auth.signInAnonymously();
      return !!auth.currentUser;
    }catch(e){
      console.error("Firebase Authentication failed:",e);
      return false;
    }finally{
      firebaseAuthPromise=null;
    }
  })();
  return firebaseAuthPromise;
}

async function hasCompletedSubject(subject){
 const localDone=results.some(r=>r.studentCode===student.code && r.subject===subject && (!r.examType || r.examType==="entrance"));
 if(localDone)return true;
 if(db&&online&&student.code){

   const snap=await Promise.race([query,new Promise((_,reject)=>setTimeout(()=>reject(new Error("completion check timeout")),3500))]);
   return snap.docs.some(d=>{const r=d.data()||{};return !r.examType || r.examType==="entrance";});
  }catch(e){console.warn("Subject completion check unavailable",e);}
 }
 return false;
}

async function startExam(subject,examType="entrance"){
 try{
  if(!student.code||!student.name){toast("Please complete your profile first");page="profile";render();return}
  const e=exams[subject];
  if(!e||!Array.isArray(e.questions)||!e.questions.length){toast("No questions in this exam");return}
  // Check the local record first, then the cloud record with a short timeout so the Start button never appears frozen.
  if(await hasCompletedSubject(subject)){
    toast(subject+" has already been completed. You cannot retake it.");
    page="weeklyExam";render();return;
  }
  examState={subject,e,examType,idx:0,answers:Array(e.questions.length).fill(null),marked:[],left:Number(e.duration)||90,start:Date.now(),startedAt:new Date().toISOString()};
  renderQuestion();
 }catch(err){
  console.error("Unable to start exam",err);
  examState=null;
  toast("Unable to start this exam. Please try again.");
  page="weeklyExam";render();
 }
}

function renderQuestion(){
  let {subject,e,idx,answers,left}=examState,q=e.questions[idx];
  const pct=((idx+1)/e.questions.length)*100;
  const nav=e.questions.map((_,i)=>{
    const c=["qNavBtn"];
    if(i===idx)c.push("current");
    if(answers[i]!==null)c.push("answered");
    if(examState.marked?.includes(i))c.push("marked");
    return `<button class="${c.join(" ")}" type="button" onclick="window.jumpQ(${i})">${i+1}</button>`;
  }).join("");
  document.getElementById("app").innerHTML=`
    <div class="examShell">
      <div class="examTop">
        <div class="examBrand"><span class="mark">EV</span><div><div class="examName">EDU-VAULT</div><div class="examSub">${esc(subject)} Examination</div></div></div>

      </div>
      <div class="card examCard">

        <div class="q">${idx+1}. ${esc(q.q)}</div>
        ${q.o.map((o,i)=>`<label class="opt"><input type="radio" name="ans" value="${i}" ${answers[idx]===i?"checked":""}> <span><b style="color:var(--cyan)">${String.fromCharCode(65+i)}.</b> ${esc(o)}</span></label>`).join("")}
        <div class="examActions">
          <button class="secondary wide" type="button" onclick="window.toggleMark()">${examState.marked?.includes(idx)?"★ Unmark":"☆ Mark"}</button>
          <button class="secondary" type="button" onclick="window.prevQ()" ${idx===0?"disabled":""}>← Previous</button>
          ${idx<e.questions.length-1?`<button class="primary" type="button" onclick="window.nextQ()">Next →</button>`:`<button class="primary" type="button" onclick="window.finishExam()">Submit Exam</button>`}
        </div>
      </div>
      <div class="card navigator">
        <h2>Question Navigator</h2>
        <div class="navGrid">${nav}</div>
        <div class="legend"><span class="lAnswered">Green = answered</span><span class="lCurrent">Blue = current</span><span class="lMarked">Gold = marked</span></div>
        <button class="primary" style="width:100%;margin-top:8px" type="button" onclick="window.finishExam()">Submit Exam</button>
      </div>
    </div>`;
  document.querySelectorAll('input[name="ans"]').forEach(x=>x.onchange=()=>{examState.answers[idx]=Number(x.value);});
  clearInterval(window.examTimer);
  window.examTimer=setInterval(()=>{
    examState.left--;
    let t=document.getElementById("timer");
    if(t)t.textContent=fmt(examState.left);
    if(examState.left<=0){clearInterval(window.examTimer);finishExam(true)}
  },1000);
}
function jumpQ(i){renderQuestionFromSaved();examState.idx=i;renderQuestion()}
function toggleMark(){

  renderQuestion();
}

function nextQ(){renderQuestionFromSaved();examState.idx++;renderQuestion()}

 }
 let e=examState.e, examType=examState.examType||"daily", correct=0; e.questions.forEach((q,i)=>{if(examState.answers[i]===q.a)correct++});
 let percent=+(correct/e.questions.length*100).toFixed(2),score=+(percent).toFixed(2);
 const submittedAt=new Date().toISOString(); const timeUsedSeconds=Math.max(0,Math.min(Number(e.duration)||90,Math.round((Date.now()-Number(examState.start||Date.now()))/1000))); let r={id:crypto.randomUUID?crypto.randomUUID():Date.now()+"",studentCode:student.code,studentName:student.name,subject:examState.subject,examId:e.id||"",examType,week:e.week||"Week 1",correct,total:e.questions.length,score,percent,startedAt:examState.startedAt||"",submittedAt,timeUsedSeconds,timeUsed:fmt(timeUsedSeconds),synced:false};
 results.unshift(r);save(LS.results,results);queueCloud(r);
 examState=null;page="weeklyExam";render();
 const completedNow=new Set(results.filter(x=>x.studentCode===student.code&&(!x.examType||x.examType==="entrance")).map(x=>x.subject));
 if(completedNow.size===SUBJECTS.length){
   toast("Subject submitted. All 6 subjects are complete — Final Result unlocked.");
 }else{
   toast(timeout?"Time finished — subject submitted":"Subject submitted successfully. Continue to the next subject.");
 }
}

async function queueCloud(r){
 if(!db||!online)return;
 try{
   if(!(await firebaseReady)) return;
   await db.collection("results").doc(r.id).set({...r,createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
   let i=results.findIndex(x=>x.id===r.id);
   if(i>=0){results[i].synced=true;save(LS.results,results);}
 }catch(e){console.warn("Cloud result save failed",e)}
}
async function syncPending(){
 if(!db||!online)return;
 for(const r of results.filter(x=>!x.synced))await queueCloud(r);
}
async function weekly(){
 let mine=results.filter(r=>r.studentCode===student.code && (!r.examType||r.examType==="entrance"));
 if(db&&online&&student.code){
  try{
   const snap=await db.collection("results").where("studentCode","==",student.code).get();
   const cloud=snap.docs.map(d=>({...d.data(),id:d.id}));
   const merged=new Map();
   [...cloud,...mine].forEach(r=>merged.set(r.id||`${r.studentCode}|${r.subject}|${r.submittedAt}`,r));
   mine=[...merged.values()].filter(r=>r.studentCode===student.code&&(!r.examType||r.examType==="entrance"));
   results=results.filter(r=>!(r.studentCode===student.code&&(!r.examType||r.examType==="entrance")));
   results.push(...mine);save(LS.results,results);
  }catch(e){console.warn("Student result sync unavailable",e);}
 }

 mine.forEach(r=>{
   const previous=bySubject[r.subject];
   if(!previous||Number(r.score??r.percent??0)>Number(previous.score??previous.percent??0))bySubject[r.subject]=r;
 });
 const completedSubjects=SUBJECTS.filter(s=>bySubject[s]);

 if(!allCompleted){
   document.getElementById("app").innerHTML=`<div class="card finalResultLocked" style="text-align:center;padding:40px 22px">

async function firebaseResultsStatus(){
  try{
    if(!navigator.onLine) return "Firebase: offline";
    if(typeof firebase === "undefined") return "Firebase: SDK not loaded";
    if(!firebaseInitialized || !db || !auth) return "Firebase: initialization failed";
    const authOk=await Promise.race([
      ensureFirebaseAuth(),
      new Promise(resolve=>setTimeout(()=>resolve(false),7000))
    ]);
    if(!authOk) return "Firebase Auth: sign-in failed";
    const timeout = new Promise((_,reject)=>setTimeout(()=>reject(new Error("timeout")),7000));
    await Promise.race([db.collection("results").limit(1).get(),timeout]);
    return "Firebase Firestore: connected";
  }catch(e){
    console.warn("Firebase status check failed:", e);
    if(e && e.code === "permission-denied") return "Firebase Firestore: permission denied — check Rules";
    if(e && e.code === "failed-precondition") return "Firebase Firestore: unavailable — check Firestore setup";
    if(e && e.code === "unavailable") return "Firebase Firestore: unavailable/offline";
    if(e && e.message === "timeout") return "Firebase Firestore: timeout";
    return "Firebase Firestore: unavailable";
  }
}

async function updateFirebaseStatus(){
  const el = document.getElementById("firebaseStatus");
  if(!el) return;
  el.textContent = "Firebase Firestore: checking…";
  const status=await firebaseResultsStatus();
  el.textContent = status;
  el.style.background = status.includes("connected") ? "#ecfdf5" : "#fff7ed";
  el.style.color = status.includes("connected") ? "#047857" : "#9a3412";
}

async function getCloudStudents(){

  if(!(await ensureFirebaseAuth())) throw new Error("Firebase Authentication is not ready");
  const snap=await db.collection("students").get();
  return snap.docs.map(d=>{

  });
}

async function syncStudentsFromCloud(){
  try{
    const cloud=await getCloudStudents();
    if(!cloud.length) return getRegisteredStudents();
    const local=getRegisteredStudents();
    const byCode=new Map(local.map(x=>[String(x.code||x.studentCode||"").toLowerCase(),x]));
    cloud.forEach(x=>byCode.set(String(x.code||x.studentCode||x.id||"").toLowerCase(),x));
    const merged=[...byCode.values()].filter(x=>x.code||x.studentCode);
    saveRegisteredStudents(merged);
    return merged;
  }catch(e){
    console.warn("Student cloud sync unavailable:",e);
    return getRegisteredStudents();
  }
}

async function ensureStudentInCloud(student){
  if(!db || !online) return false;
  if(!(await ensureFirebaseAuth())) throw new Error("Firebase Authentication is not ready");
  const code=String(student.code||student.studentCode||"").trim();
  if(!code) throw new Error("Student code is required");
  await db.collection("students").doc(code).set({
    code,
    studentCode:code,
    name:student.name||student.studentName||"",
    studentName:student.studentName||student.name||"",
    sex:student.sex||"",
    age:student.age||"",
    stream:student.stream||"Natural Sc.",
    ...(student.photo?{photo:student.photo}:{}),
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true});
  return true;
}

function readPhotoFile(input){
  return new Promise(resolve=>{
    const file=input?.files?.[0];
    if(!file){resolve("");return;}
    if(!file.type.startsWith("image/")){resolve("");return;}
    const reader=new FileReader();
    reader.onload=e=>resolve(e.target.result||"");
    reader.onerror=()=>resolve("");
    reader.readAsDataURL(file);
  });
}

  const msg=document.getElementById("addStudentMsg");
  const code=document.getElementById("newStudentCode").value.trim();
  const first_name=document.getElementById("newStudentFirstName").value.trim();
  const last_name=document.getElementById("newStudentLastName").value.trim();
  const username=document.getElementById("newStudentUsername").value.trim().toLowerCase();
  const password=document.getElementById("newStudentPassword").value;
  if(!first_name||!last_name||!username||!password){msg.textContent="First name, last name, username, and password are required.";return;}
  try{
    const response=await fetch('/api/unified/students',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_code:code,first_name,last_name,username,password,sex:document.getElementById("newStudentSex").value||"",age:document.getElementById("newStudentAge").value||"",stream:document.getElementById("newStudentStream").value.trim()||"Natural Sc."})});
    const data=await response.json(); if(!response.ok)throw new Error(data.error||'Could not create account');
    toast("Student added successfully");
    document.getElementById("newStudentCode").value="";document.getElementById("newStudentFirstName").value="";document.getElementById("newStudentLastName").value="";document.getElementById("newStudentUsername").value="";document.getElementById("newStudentPassword").value="";document.getElementById("newStudentAge").value="";document.getElementById("newStudentSex").value="";
    msg.textContent="Student account saved.";
    await loadAdminStudents();
  }catch(e){
    console.error("Add student failed",e);
    msg.textContent="Add failed: "+(e.message||e);
  }
}

async function saveEditedStudent(code){
  if(!window.EduVaultAccess?.requireAdmin())return;
  const msg=document.getElementById("editStudentMsg");
  try{
    const name=document.getElementById("editStudentName").value.trim();
    if(!name){toast("Username/full name is required");return;}
    const current=(window._adminStudents||[]).find(x=>(x.studentCode||x.code||x.id)===code)||{};
    const parts=name.split(/\s+/); const response=await fetch('/api/unified/students/'+current.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({first_name:parts.shift()||name,last_name:parts.join(' ')||'Student',sex:document.getElementById("editStudentSex").value||"",age:document.getElementById("editStudentAge").value||"",stream:document.getElementById("editStudentStream").value.trim()||"Natural Sc."})});
    const data=await response.json(); if(!response.ok)throw new Error(data.error||'Could not update account');
    toast("Student updated successfully");
    if(msg)msg.textContent="Changes saved.";
    await adminStudents();
  }catch(e){
    console.error("Update student failed",e);
    toast("Update failed: "+(e.message||e));
    if(msg)msg.textContent="Update failed: "+(e.message||e);
  }
}

async function deleteStudent(id,code){
  if(!window.EduVaultAccess?.requireAdmin())return;
  if(!confirm("Delete this student record and ALL of this student's cloud exam results? This cannot be undone."))return;
  try{
    const response=await fetch('/api/unified/students/'+id,{method:'DELETE'}); const data=await response.json(); if(!response.ok)throw new Error(data.error||'Could not delete account');
    toast("Student account deleted successfully");
    await adminStudents();
  }catch(e){
    console.error("Delete student failed",e);
    toast("Delete failed: "+(e.message||e));
  }
}

<script>
(function(){
  const SERVER_ROLE={{ flask_role|default('', true)|tojson }};
  const SERVER_STUDENT={{ flask_student|default({}, true)|tojson }};

  const gate=document.getElementById("roleGate");
  const studentPanel=document.getElementById("studentPanel");
  const adminPanel=document.getElementById("adminPanel");
  const adminMsg=document.getElementById("adminMsg");

  function enter(role,code,account){
    sessionStorage.setItem("eduVaultRole",role);
    if(code) sessionStorage.setItem("eduVaultStudentCode",code);
    gate.style.display="none";
    document.getElementById("roleLogout").hidden=false;
    window.eduVaultRole=role;
    window.eduVaultStudentCode=sessionStorage.getItem("eduVaultStudentCode")||"";
    window.eduVaultAccountId=account?.id||null;
    document.querySelectorAll(".adminOnly").forEach(el=>el.hidden=role!=="admin");
    document.querySelectorAll(".studentOnly").forEach(el=>el.hidden=role!=="student");
    window.dispatchEvent(new CustomEvent("eduvault:role-ready",{detail:{role,studentCode:window.eduVaultStudentCode}}));
  }

  document.getElementById("studentRoleBtn").onclick=function(){
    studentPanel.hidden=false;adminPanel.hidden=true;
  };

  document.getElementById("adminRoleBtn").onclick=function(){
    adminPanel.hidden=false;studentPanel.hidden=true;
    document.getElementById("adminUsernameInput").focus();
  };

  document.getElementById("studentEnterBtn").onclick=async function(){
    const student_code=document.getElementById("studentCodeInput").value.trim().toUpperCase();
    const full_name=document.getElementById("studentFullNameInput").value.trim();
    const msg=document.getElementById("studentMsg");
    if(!student_code||!full_name){msg.textContent="Please enter your student code and full name.";return;}
    this.disabled=true; this.textContent="Checking…"; msg.textContent="";
    try{
      const response=await fetch('/api/unified/student-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_code,full_name})});
      const result=await response.json();
      if(!response.ok||!result.success){msg.textContent=result.error||"Student identity verification failed.";return;}
      student={...student,...result.account,code:result.account.code,name:result.account.name};
      save(LS.student,student);
      enter("student",result.account.code,result.account); page="home"; render();
    }catch(e){console.error("Student login failed",e);msg.textContent="Could not verify student: "+e.message;}
    finally{this.disabled=false;this.textContent="Enter as Student";}
  };

  document.getElementById("adminEnterBtn").onclick=async function(){
    const username=document.getElementById("adminUsernameInput").value.trim();
    const password=document.getElementById("adminPasswordInput").value;
    if(!username||!password){adminMsg.textContent="Enter administrator username and password.";return;}
    this.disabled=true;
    try{
      const response=await fetch('/api/unified/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
      const result=await response.json();
      if(!response.ok||result.role!=="admin")throw new Error(result.error||"Administrator login failed.");
      enter("admin","",result.account); page="adminDashboard"; render();
    }catch(e){adminMsg.textContent=e.message}finally{this.disabled=false}
  };

  document.getElementById("adminPasswordInput").addEventListener("keydown",function(e){
    if(e.key==="Enter") document.getElementById("adminEnterBtn").click();
  });

  document.getElementById("roleLogout").onclick=function(){
    fetch('/api/unified/logout',{method:'POST'}).finally(()=>{sessionStorage.clear();location.reload()});
  };

  window.EduVaultAccess={
    getRole:()=>sessionStorage.getItem("eduVaultRole")||null,
    isAdmin:()=>sessionStorage.getItem("eduVaultRole")==="admin",
    isStudent:()=>sessionStorage.getItem("eduVaultRole")==="student",
    getStudentCode:()=>sessionStorage.getItem("eduVaultStudentCode")||"",
    requireAdmin:function(){
      if(!this.isAdmin()){alert("Admin access required.");return false}
      return true;
    }
  };

    studentPanel.hidden=false;
})();
</script>

<script>
/* Separate Entrance and Mock packages */
const EVU = {
  packagesKey:"ev_exam_packages_v2",
  filesKey:"ev_exam_files_v2",
  loadPackages(){
    let p=load(this.packagesKey);
    if(p&&p.entrance&&p.mock)return p;
    const old=load(LS.exams)||SAMPLE_EXAMS;
    p={entrance:old,mock:JSON.parse(JSON.stringify(old))};
    Object.values(p.entrance).forEach(x=>x.examType="entrance");
    Object.values(p.mock).forEach(x=>{x.examType="mock";x.id=(x.id||"exam")+"-mock";x.title=(x.title||x.subject||"")+" Mock Examination"});
    save(this.packagesKey,p);return p;
  },
  savePackages(p){save(this.packagesKey,p)}
};
let examPackages=EVU.loadPackages();
let storage=null;
try{ if(typeof firebase!=="undefined"&&firebaseInitialized) storage=firebase.storage(); }catch(e){console.warn("Firebase Storage unavailable",e)}

function getPackage(type,subject){return (examPackages[type]||{})[subject]}
function setPackage(type,e){examPackages[type]=examPackages[type]||{};examPackages[type][e.subject]=e;EVU.savePackages(examPackages)}
function getTypeResults(type){return results.filter(r=>r.studentCode===student.code&&r.examType===type)}
async function hasCompletedSubjectType(subject,type){
  if(results.some(r=>r.studentCode===student.code&&r.subject===subject&&r.examType===type))return true;
  if(db&&online&&student.code){
    try{
      if(!(await ensureFirebaseAuth()))return false;
      const snap=await db.collection("results").where("studentCode","==",student.code).where("subject","==",subject).where("examType","==",type).get();
      return !snap.empty;
    }catch(e){console.warn(e)}
  }
  return false;
}
function qHtml(v){return String(v??"").replace(/\n/g,"<br>")}
function safeRich(v){return String(v??"");} // trusted admin-imported exam markup
function normalizeExam(e,type){
  e=e||{};e.examType=type;e.subject=e.subject||"General";
  e.duration=Math.max(60,Number(e.duration)||3600);
  e.instructions=e.instructions||"Read each question carefully and choose the best answer.";
  e.sections=Array.isArray(e.sections)?e.sections:[];
  e.questions=Array.isArray(e.questions)?e.questions:[];
  if(!e.sections.length)e.sections=[{title:"Section 1",instructions:e.instructions,questions:e.questions}];
  let flat=[];e.sections.forEach((s,si)=>{
    s.title=s.title||`Section ${si+1}`;
    s.instructions=s.instructions||"Read the following questions carefully.";
    s.questions=Array.isArray(s.questions)?s.questions:[];
    s.questions.forEach((q,qi)=>{q.sectionIndex=si;q.number=q.number||flat.length+1;flat.push(q)})
  });
  if(e.questions.length&&!flat.length){flat=e.questions}
  e.questions=flat;
  return e;
}
Object.keys(examPackages.entrance||{}).forEach(s=>examPackages.entrance[s]=normalizeExam(examPackages.entrance[s],"entrance"));
Object.keys(examPackages.mock||{}).forEach(s=>examPackages.mock[s]=normalizeExam(examPackages.mock[s],"mock"));
EVU.savePackages(examPackages);

async function startExamV2(subject,type){
 if(!student.code||!student.name){toast("Please log in with your Student Code and Name.");return}

 examState={subject,e,examType:type,idx:0,answers:Array(e.questions.length).fill(null),marked:[],left:e.duration,start:Date.now(),startedAt:new Date().toISOString()};

function renderQuestionV2(){

 const passage=(!samePassage&&q.passage)?`<div class="passageBlock"><b>PASSAGE</b><br>${safeRich(qHtml(q.passage))}</div>`:"";
 const figure=q.image?`<div class="figureWrap"><img src="${q.image}" alt="Question figure"></div>`:"";
 const table=q.tableHtml?`<div class="passageBlock">${safeRich(q.tableHtml)}</div>`:"";
 document.getElementById("app").innerHTML=`
 <div class="examShell">
  <div class="examTop"><div class="examBrand"><span class="mark">EV</span><div><div class="examName">${examState.examType==="mock"?"MOCK EXAMINATION":"EDU-VAULT"}</div><div class="examSub">${esc(subject)} • ${examState.examType==="mock"?"Mock":"Entrance"} Examination</div></div></div><div class="timeCard"><div class="timeLabel">TIME LEFT</div><div class="timer" id="timer">${fmt(examState.left)}</div></div></div>

   <div class="questionMeta"><span>QUESTION ${idx+1} OF ${e.questions.length}</span><span>${Math.round(pct)}%</span></div><div class="progress"><i style="width:${pct}%"></i></div>
   ${passage}${figure}${table}
   <div class="q questionHtml">${q.number||idx+1}. ${safeRich(qHtml(q.html||q.q||""))}</div>
   ${(q.o||[]).map((o,i)=>`<label class="opt"><input type="radio" name="ans" value="${i}" ${answers[idx]===i?"checked":""}><span><b style="color:var(--cyan)">${String.fromCharCode(65+i)}.</b> ${safeRich(o)}</span></label>`).join("")}
   <div class="examActions"><button class="secondary wide" onclick="toggleMarkV2()">${examState.marked.includes(idx)?"★ Unmark":"☆ Mark"}</button><button class="secondary" onclick="prevQV2()" ${idx===0?"disabled":""}>← Previous</button>${idx<e.questions.length-1?`<button class="primary" onclick="nextQV2()">Next →</button>`:`<button class="primary" onclick="finishExamV2()">Submit Exam</button>`}</div>
  </div>
  <div class="card navigator"><h2>Question Navigator</h2><div class="navGrid">${e.questions.map((_,i)=>`<button class="qNavBtn ${i===idx?"current":""} ${answers[i]!==null?"answered":""} ${examState.marked.includes(i)?"marked":""}" onclick="jumpQV2(${i})">${i+1}</button>`).join("")}</div><button class="primary" style="width:100%;margin-top:12px" onclick="finishExamV2()">Submit Exam</button></div>
 </div>`;
 document.querySelectorAll('input[name="ans"]').forEach(x=>x.onchange=()=>examState.answers[idx]=Number(x.value));
 clearInterval(window.examTimer);window.examTimer=setInterval(()=>{if(!examState)return;examState.left--;const t=document.getElementById("timer");if(t)t.textContent=fmt(examState.left);if(examState.left<=0){clearInterval(window.examTimer);finishExamV2(true)}},1000);
}
function saveAnsV2(){const x=document.querySelector('input[name="ans"]:checked');if(x&&examState)examState.answers[examState.idx]=Number(x.value)}
function jumpQV2(i){saveAnsV2();examState.idx=i;renderQuestionV2()}
function nextQV2(){saveAnsV2();examState.idx++;renderQuestionV2()}
function prevQV2(){saveAnsV2();examState.idx--;renderQuestionV2()}
function toggleMarkV2(){const i=examState.idx,p=examState.marked.indexOf(i);p>=0?examState.marked.splice(p,1):examState.marked.push(i);renderQuestionV2()}

<script>
/* ================= EDUVAULT 2 — MOCK RESULT DETAILS + PDF + 1-HOUR RETAKE LOCK ================= */

function mockCooldownKey(subject){
  return "ev_mock_cooldown_"+String(student.code||"guest")+"_"+String(subject||"").replace(/\W+/g,"_");
}
function getLocalMockLast(subject){
  try{
    const v=JSON.parse(localStorage.getItem(mockCooldownKey(subject))||"null");
    return v&&v.submittedAt?new Date(v.submittedAt).getTime():0;
  }catch(e){return 0}
}
function setLocalMockLast(subject,submittedAt){
  try{localStorage.setItem(mockCooldownKey(subject),JSON.stringify({submittedAt}))}catch(e){}
}
async function getMockLastSubmit(subject, examId){
  let last=examId?0:getLocalMockLast(subject);
  results.filter(r=>r.studentCode===student.code&&r.subject===subject&&r.examType==="mock"&&(!examId||String(r.examId||"")===String(examId))).forEach(r=>{
    const submittedAt=r.submittedAt?new Date(r.submittedAt).getTime():0;
    if(submittedAt>last)last=submittedAt;
  });
  if(db&&online&&student.code){
    try{
      if(await ensureFirebaseAuth()){
        const snap=await db.collection("results")
          .where("studentCode","==",student.code)
          .where("subject","==",subject)
          .where("examType","==","mock").get();
        snap.forEach(d=>{
          const r=d.data();
          if(examId&&String(r.examId||"")!==String(examId))return;
          const t=r.submittedAt?new Date(r.submittedAt).getTime():0;
          if(t>last)last=t;
        });
      }
    }catch(e){console.warn("Mock cooldown cloud lookup:",e)}
  }
  return last;
}
async function getMockCooldown(subject, examId){
  const last=await getMockLastSubmit(subject, examId);
  if(!last)return 0;
  return Math.max(0,3600000-(Date.now()-last));
}
function cooldownFmt(ms){
  let s=Math.ceil(ms/1000);
  const h=Math.floor(s/3600);s%=3600;
  const m=Math.floor(s/60);s%=60;
  return (h?String(h).padStart(2,"0")+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

/* Start exam: both exam types may be retaken after the result is shown. */
async function startExamV2(subject,type){
  if(!student.code||!student.name){toast("Please log in with your Student Code and Name.");return}
  const raw=getPackage(type,subject);
  if(!raw){toast("No "+type+" exam package for "+subject);return}

  const e=normalizeExam(JSON.parse(JSON.stringify(raw)),type);
  if(type==="mock"){
    const cooldown=await getMockCooldown(subject,e.id);
    if(cooldown>0){toast("Retake is locked for this uploaded Mock exam for "+cooldownFmt(cooldown)+".");return;}
  }
  if(type==="entrance"){
    const currentAttempt=results.find(r=>r.studentCode===student.code&&r.subject===subject&&r.examType==="entrance"&&String(r.examId||"")===String(e.id||""));
    const finalViewed=localStorage.getItem("ev_entrance_final_result_viewed_"+String(student.code||""))==="1";
    if(currentAttempt&&!finalViewed){toast("Submit all 6 subjects and view the final result before retaking.");return;}
  }
  examState={
    subject,e,examType:type,idx:0,answers:Array(e.questions.length).fill(null),
    marked:[],left:e.duration,start:Date.now(),startedAt:new Date().toISOString()
  };
  renderQuestionV2();
}

/* Rich result details: selected answer, correct answer, explanation, passage and image. */
function buildQuestionResults(st){
  return st.e.questions.map((q,i)=>{
    const selected=st.answers[i];
    const correct=Number(q.a);
    return {
      number:q.number||i+1,
      question:q.html||q.q||"",
      options:q.o||[],
      selectedIndex:selected===null?null:selected,
      selectedAnswer:selected===null?null:(q.o||[])[selected]??null,
      correctIndex:correct,
      correctAnswer:(q.o||[])[correct]??null,
      isCorrect:selected===correct,
      explanation:q.explanation||q.answerExplanation||q.solution||q.reason||"Explanation not provided in the uploaded exam package.",
      passage:q.passage||"",
      image:q.image||"",
      tableHtml:q.tableHtml||"",
      section:(st.e.sections[q.sectionIndex]||{}).title||"Section"
    };
  });
}

/* Replace finish so the result itself stores everything needed for review and PDF. */
async function finishExamV2(timeout=false){
  if(!examState)return;
  clearInterval(window.examTimer);
  saveAnsV2();

  const st=examState,e=st.e;
  const details=buildQuestionResults(st);
  const correct=details.reduce((n,q)=>n+(q.isCorrect?1:0),0);
  const unanswered=details.filter(q=>q.selectedIndex===null).length;
  const incorrect=details.length-correct-unanswered;
  const percent=details.length?+(correct/details.length*100).toFixed(2):0;
  const used=Math.max(0,Math.min(e.duration,Math.round((Date.now()-st.start)/1000)));
  const submittedAt=new Date().toISOString();

  const r={
    id:crypto.randomUUID?crypto.randomUUID():Date.now()+"",
    studentCode:student.code,studentName:student.name,studentPhoto:student.photo||"",
    subject:st.subject,examId:e.id||"",examType:st.examType,
    correct,total:details.length,incorrect,unanswered,
    score:percent,percent,
    startedAt:st.startedAt,submittedAt,
    timeUsedSeconds:used,timeUsed:fmt(used),
    timeRemainingSeconds:Math.max(0,e.duration-used),
    timeRemaining:fmt(Math.max(0,e.duration-used)),
    allowedTime:fmt(e.duration),
    status:percent>=50?"PASS":"FAILED",
    timeout:!!timeout,synced:false,
    questionResults:details
  };

  results.unshift(r);save(LS.results,results);
  if(st.examType==="mock")setLocalMockLast(st.subject,submittedAt);
  queueCloud(r);

  examState=null;

  if(st.examType==="mock"){
    showMockResultV2(r);
    return;
  }
  const entranceResults=results.filter(x=>x.studentCode===student.code&&x.examType==="entrance");
  const completedSubjects=new Set(entranceResults.map(x=>x.subject));
  if(completedSubjects.size===SUBJECTS.length){
    page="weekly";
    await weekly();
    toast("All 6 subjects submitted. Final result unlocked.");
  }else{
    page="weeklyExam";
    render();
    toast(timeout?"Time finished — subject submitted":"Subject submitted. Continue to the next subject.");
  }
}

  weekly();

/* PNG image download — entire result + full explanations */
async function downloadMockResultImage(){
  const card=document.getElementById("mockResultCard");
  if(!card||typeof html2canvas!=="function"){toast("Image generator is not ready.");return}
  try{
    /* IMAGE RESULT MUST NOT CONTAIN EXPLANATIONS.
       Clone only the summary/result area and remove the full review section.
       The complete answer + explanation remains available in the PDF download. */
    const clone=card.cloneNode(true);
    const review=clone.querySelector("#questionReview");
    if(review) review.remove();
    clone.querySelectorAll("h2").forEach(el=>{
      if(/question review|explanation/i.test(el.textContent||"")) el.remove();
    });
    clone.querySelectorAll("p").forEach(el=>{
      if(/complete explanation|question review/i.test(el.textContent||"")) el.remove();
    });

    clone.style.position="fixed";
    clone.style.left="-100000px";
    clone.style.top="0";
    clone.style.width=Math.max(card.getBoundingClientRect().width,320)+"px";
    clone.style.background="#ffffff";
    clone.style.maxHeight="none";
    clone.style.overflow="visible";
    document.body.appendChild(clone);

    const canvas=await html2canvas(clone,{
      scale:2,
      useCORS:true,
      backgroundColor:"#ffffff",
      logging:false,
      windowWidth:Math.max(document.documentElement.scrollWidth,clone.scrollWidth)
    });

    clone.remove();

    canvas.toBlob(blob=>{
      const u=URL.createObjectURL(blob),a=document.createElement("a");
      a.href=u;
      a.download=`EduVault_${window.currentMockResult?.examType==="entrance"?"Entrance":"Mock"}_Result_${student.code||"Student"}.png`;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),2000);
    },"image/png");
  }catch(e){
    console.error(e);
    const clone=document.querySelector("#mockResultCard + *");
    document.querySelectorAll("#mockResultCard").forEach(()=>{});
    toast("Could not create the result image.");
  }
}
window.downloadMockResult=downloadMockResultImage;

/* PDF download — selectable text, answer review and explanations */
async function downloadMockResultPDF(){
  if(!window.jspdf?.jsPDF){toast("PDF generator is still loading. Try again.");return}
  const {jsPDF}=window.jspdf;
  const r=window.currentMockResult||{};
  const doc=new jsPDF({unit:"pt",format:"a4"});
  const margin=40,pageW=595,pageH=842,maxW=pageW-margin*2;
  let y=margin;

  function pageIf(h=18){if(y+h>pageH-45){doc.addPage();y=margin}}
  function text(txt,size=10,bold=false,indent=0){
    doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(size);
    const lines=doc.splitTextToSize(String(txt||""),maxW-indent);
    pageIf(lines.length*14);doc.text(lines,margin+indent,y);y+=lines.length*14;
  }
  function heading(txt){
    pageIf(30);doc.setFont("helvetica","bold");doc.setFontSize(15);doc.text(txt,margin,y);y+=22;
  }

  const examLabel=String(r.examType||"mock").toLowerCase()==="entrance"?"ENTRANCE EXAMINATION":"MOCK EXAMINATION";
  doc.setFont("helvetica","bold");doc.setFontSize(22);doc.text(`EDUVAULT — ${examLabel} RESULT`,margin,y);y+=28;
  text(`Student: ${student.name}`,11,true);
  text(`Student Code: ${student.code}`,10);
  text(`Subject: ${r.subject}`,10);
  text(`Score: ${r.correct} / ${r.total} (${r.percent}%)`,11,true);
  text(`Status: ${r.status}`,11,true);
  text(`Time Used: ${r.timeUsed}    Time Remaining: ${r.timeRemaining}    Allowed Time: ${r.allowedTime}`,10);
  y+=10;
  heading("Question Review & Explanations");

  const result=window.currentMockResult||{};
  const details=Array.isArray(result.questionResults)?result.questionResults:[];
  details.forEach((d,i)=>{
    pageIf(70);
    doc.setFont("helvetica","bold");doc.setFontSize(12);
    doc.text(`Question ${d.number} — ${d.isCorrect?"CORRECT":(d.selectedIndex===null?"UNANSWERED":"INCORRECT")}`,margin,y);y+=18;
    text(stripHtml(d.question),10,true);
    if(d.passage)text("Passage: "+stripHtml(d.passage),9);
    text("Your Answer: "+(d.selectedAnswer===null?"Not answered":stripHtml(d.selectedAnswer)),9);
    text("Correct Answer: "+stripHtml(d.correctAnswer),9,true);
    text("Explanation: "+stripHtml(d.explanation),9);
    y+=8;
  });

  const safe=(student.code||"Student").replace(/[^\w-]/g,"_");
  doc.save(`EduVault_${examLabel.startsWith("ENTRANCE")?"Entrance":"Mock"}_Result_${safe}.pdf`);
}
function stripHtml(s){
  const d=document.createElement("div");d.innerHTML=String(s??"");
  return d.textContent||d.innerText||"";
}
</script>
