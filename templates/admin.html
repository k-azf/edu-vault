{% extends 'base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto px-6 py-10">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 rounded-3xl shadow-xl space-y-6">
        
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-4">
            <div>
                <a href="/" class="text-blue-600 dark:text-blue-400 hover:underline text-xs font-bold uppercase tracking-wider mb-1 inline-block">← Back to Dashboard</a>
                <h1 class="text-2xl font-black text-slate-800 dark:text-white">Admin: Smart Categorized Upload</h1>
                <p class="text-xs text-slate-400">Upload PDF/JSON and automatically route to Worksheets, Entrance Exams, or Subject Chapters.</p>
            </div>
            <span class="bg-blue-100 dark:bg-blue-950 text-blue-600 dark:text-blue-400 text-xs font-black uppercase px-3 py-1.5 rounded-full">Auto Classifier</span>
        </div>

        <form id="upload-form" class="space-y-5">
            
            <!-- Resource Type & Category Selection -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Resource Type</label>
                    <select name="resource_type" id="resource_type" class="w-full bg-slate-50 dark:bg-slate-950 p-3 border border-slate-200 dark:border-slate-800 rounded-xl text-xs font-bold dark:text-white outline-none">
                        <option value="Exam">Exam (Model / Entrance / School)</option>
                        <option value="Worksheet">Worksheet / Practice Paper</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Category Sub-type</label>
                    <select name="category" id="category" class="w-full bg-slate-50 dark:bg-slate-950 p-3 border border-slate-200 dark:border-slate-800 rounded-xl text-xs font-bold dark:text-white outline-none">
                        <option value="National Entrance (EUEE)">National Entrance Exam (EUEE)</option>
                        <option value="Model Exam">National Model Exam</option>
                        <option value="School Midterm / Final">School Midterm / Final Exam</option>
                        <option value="Chapter Worksheet">Chapter Worksheet</option>
                    </select>
                </div>
            </div>

            <!-- Subject & Grade -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Subject</label>
                    <select name="subject" class="w-full bg-slate-50 dark:bg-slate-950 p-3 border border-slate-200 dark:border-slate-800 rounded-xl text-xs font-bold dark:text-white outline-none">
                        <option value="Mathematics">Mathematics</option>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Biology">Biology</option>
                        <option value="English">English</option>
                        <option value="Agriculture">Agriculture</option>
                        <option value="Economics">Economics</option>
                        <option value="Geography">Geography</option>
                        <option value="History">History</option>
                        <option value="IT">Information Technology (IT)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Grade Level</label>
                    <select name="grade" class="w-full bg-slate-50 dark:bg-slate-950 p-3 border border-slate-200 dark:border-slate-800 rounded-xl text-xs font-bold dark:text-white outline-none">
                        <option value="12">Grade 12</option>
                        <option value="11">Grade 11</option>
                        <option value="10">Grade 10</option>
                        <option value="9">Grade 9</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Academic Year / Exam Year</label>
                    <input type="text" name="academic_year" placeholder="e.g. 2016 E.C / 2024" class="w-full bg-slate-50 dark:bg-slate-950 p-3 border border-slate-200 dark:border-slate-800 rounded-xl text-xs dark:text-white outline-none">
                </div>
            </div>

            <!-- Title & Chapter Mapping -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Exam / Worksheet Title</label>
                    <input type="text" name="title" required placeholder="e.g. Grade 12 Physics Entrance Exam 2016" class="w-full bg-slate-50 dark:bg-slate-950 p-3 border border-slate-200 dark:border-slate-800 rounded-xl text-xs dark:text-white outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Chapter Name (Optional)</label>
                    <input type="text" name="chapter_name" placeholder="e.g. Chapter 1: Electrostatics" class="w-full bg-slate-50 dark:bg-slate-950 p-3 border border-slate-200 dark:border-slate-800 rounded-xl text-xs dark:text-white outline-none">
                </div>
            </div>

            <!-- File Drag and Drop -->
            <div class="p-6 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-2xl text-center">
                <input type="file" id="file-input" name="pdf_file" accept=".pdf,.json" required class="hidden">
                <label for="file-input" class="cursor-pointer space-y-2 block">
                    <div class="text-3xl">📄</div>
                    <span id="file-name" class="text-xs font-bold text-blue-600 block">Click to select PDF or JSON Exam File</span>
                    <span class="text-[10px] text-slate-400 uppercase block font-bold">Supports PDF (ChatGPT AI Auto-Parse) or Standard JSON</span>
                </label>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl transition shadow-lg shadow-blue-500/20 uppercase tracking-wider text-xs">
                Classify & Upload Resource
            </button>
        </form>

        <div id="status-msg" class="hidden p-4 rounded-2xl text-center text-xs font-bold"></div>
    </div>
</div>

<script>
    document.getElementById('file-input').addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
            document.getElementById('file-name').innerText = "Selected: " + e.target.files[0].name;
        }
    });

    document.getElementById('upload-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const status = document.getElementById('status-msg');
        const formData = new FormData(this);

        btn.disabled = true;
        btn.innerText = "Processing & Categorizing File...";
        status.className = "p-4 rounded-2xl text-center text-xs font-bold bg-slate-100 text-slate-600 block animate-pulse";
        status.innerText = "Analyzing content and routing to correct Subject ➔ Chapter section...";

        fetch('/api/upload', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                status.className = "p-4 rounded-2xl text-center text-xs font-bold bg-emerald-100 text-emerald-800 block";
                status.innerText = "🎉 " + data.message;
                document.getElementById('upload-form').reset();
                document.getElementById('file-name').innerText = "Click to select PDF or JSON Exam File";
            } else {
                status.className = "p-4 rounded-2xl text-center text-xs font-bold bg-rose-100 text-rose-800 block";
                status.innerText = "❌ Error: " + data.error;
            }
        })
        .catch(err => {
            status.className = "p-4 rounded-2xl text-center text-xs font-bold bg-rose-100 text-rose-800 block";
            status.innerText = "❌ Upload Failed. Check server connection.";
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerText = "Classify & Upload Resource";
        });
    });
</script>
{% endblock %}
